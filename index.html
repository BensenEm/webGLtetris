<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- The page itself must not zoom or pan: pinching zooms the 3D camera
         instead, handled on the canvas. viewport-fit=cover lets the layout
         reach under the notch/home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="author" content="Benjamin Molnár">
    <meta name="keywords" content="tetris online 3D">
    <title>3D Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <link href="benstyle.css" rel="stylesheet">
  </head>

  <body>
    <div id="all">
      <div id="left">
        <!-- Doubles as the legend and as a playable on-screen keyboard: every
             keycap is a real button wired to the same action as its key. -->
        <div id="controls">
          <h2 class="controls-title">Controls</h2>
          <p class="controls-hint">Click a key or use the keyboard.</p>

          <!-- Three groups, which become the three columns in portrait:
               movement and dropping, then rotation, then everything else. -->
          <div class="controls-body">
            <div class="control-group">
              <div class="control">
                <span class="control-label">Move left/right</span>
                <span class="keys">
                  <button type="button" class="key" data-key="KeyJ">J</button>
                  <button type="button" class="key" data-key="KeyL">L</button>
                </span>
              </div>
              <div class="control">
                <span class="control-label">Move front/back</span>
                <span class="keys">
                  <button type="button" class="key" data-key="KeyK">K</button>
                  <button type="button" class="key" data-key="KeyI">I</button>
                </span>
              </div>
              <div class="control">
                <span class="control-label">Drop one step</span>
                <span class="keys">
                  <button type="button" class="key key-wide" data-key="Space">Space</button>
                </span>
              </div>
              <div class="control">
                <span class="control-label">Drop all the way</span>
                <span class="keys">
                  <button type="button" class="key key-wide" data-key="Enter">Enter</button>
                </span>
              </div>
            </div>

            <div class="control-group">
              <div class="control">
                <span class="control-label">Rotate around X</span>
                <span class="keys">
                  <button type="button" class="key" data-key="KeyE">E</button>
                  <button type="button" class="key" data-key="KeyR">R</button>
                </span>
              </div>
              <div class="control">
                <span class="control-label">Rotate around Y</span>
                <span class="keys">
                  <button type="button" class="key" data-key="KeyD">D</button>
                  <button type="button" class="key" data-key="KeyF">F</button>
                </span>
              </div>
              <div class="control">
                <span class="control-label">Rotate around Z</span>
                <span class="keys">
                  <button type="button" class="key" data-key="KeyC">C</button>
                  <button type="button" class="key" data-key="KeyV">V</button>
                </span>
              </div>
            </div>

            <div class="control-group">
              <div class="control">
                <span class="control-label">Rotate game</span>
                <span class="keys">
                  <button type="button" class="key" data-key="KeyQ">Q</button>
                </span>
              </div>
              <div class="control">
                <span class="control-label">Toggle view</span>
                <span class="keys">
                  <button type="button" class="key" data-key="KeyA">A</button>
                </span>
              </div>
              <div class="control">
                <span class="control-label">Pause</span>
                <span class="keys">
                  <button type="button" class="key" data-key="KeyP">P</button>
                </span>
              </div>
              <div class="control">
                <span class="control-label">Music on/off</span>
                <span class="keys">
                  <button type="button" class="key" data-key="Digit0">0</button>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="mid">
        <div id="frame">
          <div id="hud">
            <div id="scoreBox">Score: 0<br>Lines: 0<br>Level: 1</div>
          </div>
          <div id="gameOverBox" hidden>
            <div id="gameOverText">Game Over</div>
            <button type="button" id="restartButton">Play again</button>
          </div>
        </div>
      </div>
    </div>

    <noscript>
      <p>This game requires JavaScript and WebGL.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
