<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- The page itself must not zoom or pan: pinching zooms the 3D camera
         instead, handled on the canvas. viewport-fit=cover lets the layout
         reach under the notch/home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="author" content="Benjamin Molnár">
    <meta name="keywords" content="tetris online 3D">
    <title>3D Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <link href="benstyle.css" rel="stylesheet">
  </head>

  <body>
    <div id="all">
      <!-- The legend, and a playable on-screen keyboard: every keycap is a real
           button wired to the same action as its key.

           Two panels, of which CSS shows exactly one. They are not one panel
           reflowed, because the two want different content as well as a
           different shape: the roomy one beside the board shows both
           directions of every rotation, while the one under a phone held
           upright cannot afford eight caps and shows the forward direction
           only. Trying to serve both from one set of markup is what made this
           a pile of breakpoint overrides. -->
      <div id="left">
        <!-- Beside the board: one pad above the next. -->
        <div class="controls-panel controls-wide">
          <div class="controls-body">
            <!-- Arrow-shaped caps in a d-pad cross. Up moves the piece away
                 from the viewer, down towards them.

                 Three nested elements per arrow, and each level earns its
                 keep: the button is the hit target, .arrow-shell carries the
                 drop-shadow, and .arrow-face carries the clip-path. They have
                 to be separate because clip-path is applied *after* filter, so
                 an arrow that clipped and shadowed itself would clip its own
                 shadow away. Where an arrow carries text (the drop pad), it is
                 a sibling of the shell rather than inside it, so the shadow is
                 not traced under the lettering as well.

                 These four are the keyboard's own arrow keys, so they carry no
                 lettering at all. -->
            <div class="pad pad-move" role="group" aria-label="Move">
              <button type="button" class="key key-arrow dir-up" data-key="ArrowUp"
                      aria-label="Move back">
                <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
              </button>
              <button type="button" class="key key-arrow dir-left" data-key="ArrowLeft"
                      aria-label="Move left">
                <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
              </button>
              <button type="button" class="key key-arrow dir-right" data-key="ArrowRight"
                      aria-label="Move right">
                <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
              </button>
              <button type="button" class="key key-arrow dir-down" data-key="ArrowDown"
                      aria-label="Move front">
                <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
              </button>
            </div>

            <!-- The down arrow again, stretched: dashed for the one-step drop,
                 solid for the drop all the way. Same markup as a d-pad arrow,
                 and the same clip-path — only the box it is drawn into is
                 taller. -->
            <div class="pad pad-drop" role="group" aria-label="Drop">
              <div class="drop-arrows">
                <button type="button" class="key key-arrow key-drop drop-step" data-key="Space"
                        aria-label="Drop one step">
                  <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
                  <span class="arrow-key">Space</span>
                </button>
                <button type="button" class="key key-arrow key-drop" data-key="Enter"
                        aria-label="Drop all the way">
                  <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
                  <span class="arrow-key">Enter</span>
                </button>
              </div>
            </div>

            <!-- Forward cap on top, the reverse under it, label under both. -->
            <div class="pad pad-keys" role="group" aria-label="Rotate">
              <div class="cell">
                <button type="button" class="key" data-key="KeyS">S</button>
                <button type="button" class="key" data-key="KeyW">W</button>
                <span class="cap-label">Rotate X</span>
              </div>
              <div class="cell">
                <button type="button" class="key" data-key="KeyD">D</button>
                <button type="button" class="key" data-key="KeyE">E</button>
                <span class="cap-label">Rotate Y</span>
              </div>
              <div class="cell">
                <button type="button" class="key" data-key="KeyF">F</button>
                <button type="button" class="key" data-key="KeyR">R</button>
                <span class="cap-label">Rotate Z</span>
              </div>
              <div class="cell">
                <button type="button" class="key" data-key="KeyQ">Q</button>
                <button type="button" class="key" data-key="KeyA">A</button>
                <span class="cap-label">Rotate game</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Under a phone held upright: two columns, one per thumb. Forward
             rotations only, and the board turn rides along with the drop
             arrows, where there is room going spare. -->
        <div class="controls-panel controls-compact">
          <div class="controls-body">
            <div class="pad pad-move" role="group" aria-label="Move">
              <button type="button" class="key key-arrow dir-up" data-key="ArrowUp"
                      aria-label="Move back">
                <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
              </button>
              <button type="button" class="key key-arrow dir-left" data-key="ArrowLeft"
                      aria-label="Move left">
                <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
              </button>
              <button type="button" class="key key-arrow dir-right" data-key="ArrowRight"
                      aria-label="Move right">
                <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
              </button>
              <button type="button" class="key key-arrow dir-down" data-key="ArrowDown"
                      aria-label="Move front">
                <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
              </button>
            </div>

            <div class="pad pad-drop" role="group" aria-label="Drop">
              <div class="drop-arrows">
                <button type="button" class="key key-arrow key-drop drop-step" data-key="Space"
                        aria-label="Drop one step">
                  <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
                  <span class="arrow-key">Space</span>
                </button>
                <button type="button" class="key key-arrow key-drop" data-key="Enter"
                        aria-label="Drop all the way">
                  <span class="arrow-shell" aria-hidden="true"><span class="arrow-face"></span></span>
                  <span class="arrow-key">Enter</span>
                </button>
              </div>
              <!-- Last in the markup as well as on screen, so the tab order
                   follows the eye. -->
              <div class="cell cell-mid">
                <button type="button" class="key" data-key="KeyQ">Q</button>
                <span class="cap-label">Rotate game</span>
              </div>
            </div>

            <div class="pad pad-keys" role="group" aria-label="Rotate">
              <div class="cell">
                <button type="button" class="key" data-key="KeyS">S</button>
                <span class="cap-label">Rotate X</span>
              </div>
              <div class="cell">
                <button type="button" class="key" data-key="KeyD">D</button>
                <span class="cap-label">Rotate Y</span>
              </div>
              <div class="cell">
                <button type="button" class="key" data-key="KeyF">F</button>
                <span class="cap-label">Rotate Z</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="mid">
        <div id="frame">
          <div id="hud">
            <div id="scoreBox">Score: 0<br>Lines: 0<br>Level: 1</div>
          </div>
          <div id="gameOverBox" hidden>
            <div id="gameOverText">Game Over</div>
            <button type="button" id="restartButton">Play again</button>
          </div>
        </div>
      </div>
    </div>

    <!-- The controls that act on the session rather than on the piece. Pinned
         to the top right of the screen on every layout, opposite the score,
         and outside #all so no layout has to make room for it. Bare caps: it
         sits directly on the sky, so its labels are dark rather than cream. -->
    <div id="sessionControls" class="pad pad-keys" role="group" aria-label="Game">
      <div class="cell">
        <button type="button" class="key" data-key="KeyO">O</button>
        <span class="cap-label">Toggle view</span>
      </div>
      <div class="cell">
        <button type="button" class="key" data-key="KeyP">P</button>
        <span class="cap-label">Pause</span>
      </div>
      <div class="cell">
        <button type="button" class="key" data-key="Digit0">0</button>
        <span class="cap-label">Music on/off</span>
      </div>
    </div>

    <noscript>
      <p>This game requires JavaScript and WebGL.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
